# Round robin over every api-lb replica. Docker's DNS returns all replica addresses for "api-lb", and nginx
# resolves the name once at startup: run `docker compose restart nginx` after changing the replica count.
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  access_log off; # the load generator is the measurement
  # Default is 1000: a sustained load test's client connections would otherwise be forced to reconnect mid-run.
  keepalive_requests 100000;

  upstream api {
    server api-lb:3000;
    keepalive 256;
    # Same reasoning on the upstream side: without this, nginx's own connections to a replica cycle every 100
    # requests (nginx's default) or 60s, adding reconnect latency to a run long/heavy enough to hit it.
    keepalive_requests 100000;
    keepalive_timeout 60s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection ""; # keep upstream connections alive
      proxy_set_header Host $host;
    }
  }
}
